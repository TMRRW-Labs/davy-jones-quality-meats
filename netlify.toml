# Davy Jones Quality Meats — build and headers.
#
# The site is generated by build.sh (bash + awk + perl, all present on
# Netlify's Ubuntu image) into dist/. Redirects and response headers ship as
# dist/_redirects and dist/_headers, which Netlify picks up automatically.

[build]
  command = "bash ./build.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
